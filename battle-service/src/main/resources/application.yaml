server:
  error:
    include-message: always
  port: 8085

spring:
  application:
    name: battle-service

  # Banco em memória: as batalhas somem ao reiniciar o serviço.
  # Para usar o MySQL no lugar, troque url/driver/username/password por:
  #   url: jdbc:mysql://localhost:3306/chronos_battle?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: chronos_battle_app
  #   password: ${CHRONOS_DB_PASSWORD}
  # e apague o schema.sql (o Hibernate cria a tabela com ddl-auto: update).
  datasource:
    url: jdbc:h2:mem:battledb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

chronos:
  jwt:
    # Caminho da chave PÚBLICA do user-service no seu computador.
    # Mesma variável de ambiente dos outros serviços: JWT_PUBLIC_KEY_LOCATION.
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION}
  character-service:
    # O battle lê os atributos do personagem em GET /characters/{id}.
    url: ${CHRONOS_CHARACTER_URL:http://localhost:8082}
