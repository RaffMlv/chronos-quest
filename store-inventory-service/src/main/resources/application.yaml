server:
  error:
    include-message: always
  port: 8083

spring:
  application:
    name: store-inventory-service

  datasource:
    url: jdbc:mysql://localhost:3306/chronos_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
    username: chronos_store_app
    password: ${CHRONOS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

chronos:
  jwt:
    # Caminho da chave PÚBLICA do user-service (variável JWT_PUBLIC_KEY_LOCATION, igual aos outros serviços)
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION}
