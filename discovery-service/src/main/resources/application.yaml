server:
  port: 8761

spring:
  application:
    name: discovery-service
  cloud:
    service-registry:
      auto-registration:
        enabled: false

eureka:
  instance:
    prefer-ip-address:true
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info

endpoint:
  health:
    show-details: always

