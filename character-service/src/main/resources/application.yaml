server:
  port: 8082

spring:
  application:
    name: character-service

  datasource:
    url: jdbc:mysql://localhost:3306/chronos_character?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
    username: chronos_character_app
    password: ${CHRONOS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    public-key: file:C:/Users/Acer/projetos/chronos-secrets/user-service/public.pem
