server:
  port: 8761

spring:
  application:
    name: discovery-service
  cloud:
    service-registry:
      auto-registration:
        enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/