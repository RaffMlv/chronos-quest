server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users,/api/users/**
              filters:
                - StripPrefix=1

            - id: auth-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/auth,/api/auth/**
              filters:
                - StripPrefix=1

            - id: character-service-route
              uri: lb://character-service
              predicates:
                - Path=/api/characters,/api/characters/**
              filters:
                - StripPrefix=1

            - id: battle-service-route
              uri: lb://battle-service
              predicates:
                - Path=/api/battles,/api/battles/**
              filters:
                - StripPrefix=1

            - id: store-service-route
              uri: lb://store-inventory-service
              predicates:
                - Path=/api/store,/api/store/**
              filters:
                - StripPrefix=1

            - id: inventory-service-route
              uri: lb://store-inventory-service
              predicates:
                - Path=/api/inventory,/api/inventory/**
              filters:
                - StripPrefix=1

            - id: notification-service-route
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications,/api/notifications/**
              filters:
                - StripPrefix=1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_LOCATION}