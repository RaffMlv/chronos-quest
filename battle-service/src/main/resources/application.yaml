
server:
  error:
    include-message: always
  port: 8085

spring:
  application:
    name: battle-service

  # MySQL: banco chronos_battle
  datasource:
    url: jdbc:mysql://localhost:3306/chronos_battle?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza
    username: chronos_battle_app
    password: ${CHRONOS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

chronos:
  jwt:
    # Caminho da chave pública do user-service
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION}

  character-service:
    # URL do Character Service
    url: ${CHRONOS_CHARACTER_URL:http://localhost:8082}

  notification-service:
    # URL do Notification Service
    url: ${CHRONOS_NOTIFICATION_URL:http://localhost:8084}
